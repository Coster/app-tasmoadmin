root /var/www/tasmoadmin/;

location / {
    try_files $uri /index.php$is_args$args;
}

location /data/firmwares {
    add_header Access-Control-Allow-Origin *;
}

location /data/ {
    deny all;
}

location ~ ^/index\.php(/|$) {
    fastcgi_pass 127.0.0.1:9001;
    fastcgi_read_timeout 900;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;

    # Base URL for all links in the UI (differs between direct and ingress)
    fastcgi_param TASMO_BASEURL $tasmo_baseurl;
    # OTA URLs handed to Tasmota devices always point to the direct port
    fastcgi_param TASMO_OTA_BASEURL "/";

    internal;
}

location ~ ^(.*)\.(css|js|gif|jpe?g|png|svg|ico|woff2?|json|cache\.json)$ {
}
