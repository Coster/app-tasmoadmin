worker_processes  1;
pid /var/run/nginx.pid;
user nginx nginx;

events {
    worker_connections  1024;
}

http {
    include            mime.types;
    default_type       application/octet-stream;
    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # Tasmota firmware images (ESP32 builds) are larger than nginx' 1M default
    client_max_body_size 32m;

    include /etc/nginx/servers/*.conf;
}
