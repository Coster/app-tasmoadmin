---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log details the app provides.
  ssl:
    name: SSL
    description: >-
      Enables/Disables SSL (HTTPS) on the web interface.
  certfile:
    name: Certificate file
    description: >-
      The certificate file to use for SSL. Note that this file must
      exist in the /ssl/ folder.
  keyfile:
    name: Private key file
    description: >-
      The private key file to use for SSL. Note that this file must
      exist in the /ssl/ folder.
  ota_server_ip:
    name: OTA server IP
    description: >-
      IP address of Home Assistant that Tasmota devices use to download
      firmware. Leave empty to detect it automatically.
network:
  9541/tcp: Web interface and OTA firmware downloads (must stay enabled for OTA)
