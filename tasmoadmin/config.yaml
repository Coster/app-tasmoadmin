---
name: TasmoAdmin (Ingress)
version: 0.34.1-ingress.1
slug: sonweb
description: Centrally manage and OTA-update all your Tasmota devices (sidebar/ingress fork)
url: https://github.com/Coster/app-tasmoadmin
webui: "[PROTO:ssl]://[HOST]:[PORT:9541]"
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:chip
panel_title: TasmoAdmin
hassio_api: true
init: false
arch:
  - aarch64
  - amd64
map:
  - ssl
  - share
ports:
  9541/tcp: 9541
ports_description:
  9541/tcp: TasmoAdmin web interface
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
  ota_server_ip: str?
